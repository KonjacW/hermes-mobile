name: Android CI/CD

env:
  GRADLE_CACHE_ENCRYPTED_KEY: ${{ secrets.GRADLE_ENCRYPTED_KEY }}

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs when a new commit lands on the same PR branch.
# On main (push events), each commit gets a unique group so rapid merges
# don't cancel each other's CI runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Job 0: Detect changes — skips heavy Android build/tests for doc-only PRs
  # ─────────────────────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Paths Filter
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'app/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/android.yml'
              - '.editorconfig'
              - 'flake.nix'
              - 'flake.lock'

  # ─────────────────────────────────────────────────────────────────────
  # Job 1: ktlint (code style) — fastest feedback, runs in parallel.
  # ─────────────────────────────────────────────────────────────────────
  ktlint:
    name: ktlint — Code Style
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTED_KEY }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Cache ktlint
        id: cache-ktlint
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/ktlint
          key: ktlint-1.8.0

      - name: Install ktlint
        if: steps.cache-ktlint.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod +x ktlint
          mv ktlint ~/.local/bin/

      - name: Add local bin to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run ktlintCheck
        run: ./gradlew ktlintCheck

      - name: Run checkColorLiterals (hardcoded Color guard, issue #622)
        run: ./gradlew checkColorLiterals

      - name: Upload ktlint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ktlint-reports
          path: |
            app/build/reports/ktlint/
            build/reports/ktlint/
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Job 2: Android Lint (static analysis) — runs in parallel with ktlint.
  # Depends on compileDebugKotlin, so it also catches unresolved refs.
  # ─────────────────────────────────────────────────────────────────────
  android-lint:
    name: Android Lint — Static Analysis
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTED_KEY }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run lintDebug
        run: ./gradlew lintDebug

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.*
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Job 3: Unit tests — runs in parallel with ktlint & android-lint.
  # ─────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit & Integration Tests
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Fork note: a fork repo has no Gradle build cache (setup-gradle defaults to
    # cache-read-only on non-default branches, and the fork has no
    # GRADLE_ENCRYPTED_KEY secret), so a cold unit-test run takes ~3-5 min more
    # than upstream's cached 7m20s and overruns the original 10 min budget.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTED_KEY }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run test
        run: ./gradlew test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Job 4: Build Debug APK — depends on all three above passing.
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: Build Debug APK
    needs: [changes, ktlint, android-lint, unit-tests]
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTED_KEY }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Fork note: GitHub-hosted runners start with no ~/.android/debug.keystore, so
      # AGP generates a fresh random debug key on every run. Each build would then
      # carry a different signature and could no longer upgrade-install over the
      # previous one — every install would need uninstall + re-login, wiping the
      # app's local cache. So restore one pinned keystore (alias `androiddebugkey`,
      # store/key password `android`, which is what AGP's debug signing config
      # expects) instead of letting the runner invent one. Deliberately not
      # actions/cache: a cached key is evictable and branch-scoped, and once it is
      # evicted the app's signing identity is gone for good, forcing another
      # uninstall. The same bytes also live offline as a backup.
      - name: Restore pinned debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 is not set — this build would get a throwaway signature"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          # Assert the pinned identity instead of hoping: a wrong/rotated secret would
          # otherwise only surface later as an "app not installed" on someone's phone.
          expected="7C:CC:A9:61:AA:71:57:A4:AC:9C:B2:E8:51:2F:3A:47:B6:C7:43:07:87:03:CD:6B:96:62:FD:C2:90:E1:8E:B7"
          actual=$(keytool -J-Duser.language=en -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          echo "debug keystore certificate SHA-256: $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::pinned debug keystore is not the expected identity (expected $expected, got '$actual')"
            exit 1
          fi

      - name: Build assembleDebug
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: hermescontrol-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Job 5: Release Compile — verifies release variant compiles.
  # Catches issues like debugImplementation-scoped dependencies that
  # main source code depends on (e.g. okhttp3.logging.HttpLoggingInterceptor).
  # debug-only CI jobs (ktlint, lint, tests) won't catch these.
  # ─────────────────────────────────────────────────────────────────────
  release-compile:
    name: Release Compile Check
    needs: [changes, ktlint, android-lint, unit-tests]
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTED_KEY }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Compile release Kotlin
        run: ./gradlew compileReleaseKotlin

  # ─────────────────────────────────────────────────────────────────────
  # Job 6: Instrumented tests — runs on Android emulator.
  # Required for Compose UI tests (TEST-09, TEST-14) and Navigation3 tests
  # that need a real Activity lifecycle. Cannot run on JVM.
  # ─────────────────────────────────────────────────────────────────────
  instrumented-tests:
    name: Instrumented Tests
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTED_KEY }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Enable KVM hardware acceleration on the Linux runner
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Cache the AVD to avoid downloading/recreating it from scratch every time
      - name: AVD Cache
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-atd-x86_64

      - name: Run connectedDebugAndroidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -memory 2048
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: androidTest-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Job 7: PR status summary — aggregates all checks.
  # ─────────────────────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    needs: [changes, ktlint, android-lint, unit-tests, build, release-compile]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check job results
        env:
          GH_TOKEN: ${{ github.token }}
          KTLINT_RESULT: ${{ needs.ktlint.result }}
          LINT_RESULT: ${{ needs.android-lint.result }}
          TEST_RESULT: ${{ needs.unit-tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_COMPILE_RESULT: ${{ needs.release-compile.result }}
        run: |
          LABEL="ci-red"
          FAILED=0
          FAILED_JOBS=""
          for entry in "ktlint:$KTLINT_RESULT" "android-lint:$LINT_RESULT" "unit-tests:$TEST_RESULT" "build:$BUILD_RESULT" "release-compile:$RELEASE_COMPILE_RESULT"; do
            name="${entry%%:*}"
            result="${entry#*:}"
            echo "::notice::$name = $result"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              FAILED=1
              FAILED_JOBS+="$name "
            fi
          done

          # Label the PR so red CI is visible at a glance; remove it once green.
          # Only PR events carry a PR number — pushes to main have nothing to label.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR=${{ github.event.pull_request.number }}
            if [[ "$FAILED" -eq 1 ]]; then
              gh pr edit "$PR" --add-label "$LABEL" \
                && echo "::notice::Added \"$LABEL\" to PR #$PR (failed: ${FAILED_JOBS% })"
            else
              # Fails if the label isn't present — that's fine, ignore it.
              gh pr edit "$PR" --remove-label "$LABEL" 2>/dev/null || true
            fi
          fi

          if [[ "$FAILED" -eq 1 ]]; then
            echo "::error::CI failed (${FAILED_JOBS% }) — check individual job logs"
            exit 1
          fi
          echo "All CI jobs passed ✅"
